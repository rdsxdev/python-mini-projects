<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
</head>
<body>


<h1>BMI Calculator</h1>

<form method="POST">

    <label>Weight (kg):</label><br>
    <input type="number" step="any" name="weight" required><br><br>

    <label>Height (cm):</label><br>
    <input type="number" step="any" name="height" required><br><br>

    <label>Decimal places:</label><br>
    <input type="number" name="places" required><br><br>

    <button type="submit">Calculate</button>

</form>

{% if result %}
    <h2>{{ result }}</h2>
    <h3>{{ category }}</h3>
{% endif %}

<a href="/conditionals">Back</a>

</body>
</html>
