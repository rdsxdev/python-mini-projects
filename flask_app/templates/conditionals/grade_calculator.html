<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade Calculator</title>
</head>
<body>


<h1>Grade Calculator</h1>

<form method="POST">

    <label>Points Earned:</label><br>
    <input type="number" step="any" name="pe" required><br><br>

    <label>Total Points:</label><br>
    <input type="number" step="any" name="tn" required><br><br>

    <label>Decimal places:</label><br>
    <input type="number" name="places" value="2" required><br><br>

    <button type="submit">Calculate</button>

</form>

{% if result %}
    <h2>{{ result }}</h2>
    <h3>{{ grade_letter }}</h3>
{% endif %}

<a href="/conditionals">Back</a>

</body>
</html>
