<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
</head>
<body>


<h1>Calculator</h1>

<form method="POST">

    <label>Enter first number:</label><br>
    <input type="number" step="any" name="a" required><br><br>

    <label>Enter second number:</label><br>
    <input type="number" step="any" name="b" required><br><br>

    <label>Select operation:</label><br>
    <select name="operation">
        <option value="1">Addition</option>
        <option value="2">Subtraction</option>
        <option value="3">Multiplication</option>
        <option value="4">Division</option>
    </select><br><br>

    <label>Decimal places (for division):</label><br>
    <input type="number" name="places" value="2" required><br><br>

    <button type="submit">Calculate</button>

</form>

{% if result %}
    <h2>{{ result }}</h2>
{% endif %}

<a href="/conditionals">Back</a>

</body>
</html>
